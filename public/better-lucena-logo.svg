<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Better Lucena City logo">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3BA3E8"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3CB878"/>
      <stop offset="1" stop-color="#00695C"/>
    </linearGradient>
  </defs>
  <!-- Tayabas Bay (water) -->
  <circle cx="32" cy="32" r="31" fill="url(#water)"/>
  <!-- gold sunrise rising behind the land -->
  <g fill="#FCD20F">
    <circle cx="32" cy="21" r="8.5"/>
  </g>
  <g stroke="#FCD20F" stroke-width="1.6" stroke-linecap="round">
    <line x1="32" y1="6" x2="32" y2="9.5"/>
    <line x1="22" y1="12" x2="24.5" y2="14.5"/>
    <line x1="42" y1="12" x2="39.5" y2="14.5"/>
    <line x1="16" y1="21" x2="19.5" y2="21"/>
    <line x1="48" y1="21" x2="44.5" y2="21"/>
  </g>
  <!-- Lucena City landmass (smaller than the water) -->
  <path d="M 14,30
           C 18,27 22,29 26,27
           C 31,24 37,29 42,27
           C 46,26 50,29 51,31
           L 52,41
           C 48,45 44,40 40,44
           C 36,47 32,41 28,45
           C 24,48 20,42 17,46
           C 15,48 13,44 13,41
           Z" fill="url(#land)"/>
</svg>
