name: Delete Merged Branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$BASE_REPO" = "$REPO" ]; then
            gh api \
              --method DELETE \
              "repos/$REPO/git/refs/heads/$BRANCH"
          else
            echo "Skipping branch deletion because it belongs to a fork."
          fi
